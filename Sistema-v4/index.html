<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - Inventario</title>
    <link rel="icon" href="./img/tecnica.jpg">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="login">
    <header>
        <div class="conter-logo"><img src="./img/tecnica.jpg" alt="Logo de la escuela"></div>
        <h1>Inventario</h1>
    </header>

    <main>
        <form id="form-login" class="conter-form" autocomplete="on">
            <input type="text" id="usuario" name="usuario" placeholder="Usuario" autocomplete="username" required>
            <input type="password" id="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
            <p id="error" class="error-login" role="alert"></p>
            <button type="submit" class="btn">INGRESAR</button>
        </form>
    </main>

    <footer><h3>2026 TODOS LOS DERECHOS RESERVADOS - MONTE HERMOSO / BUENOS AIRES / ARGENTINA</h3></footer>

    <script src="./js/datos.js"></script>
    <script src="./js/login.js"></script>
</body>
</html>
